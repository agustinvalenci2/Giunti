services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Local HTTP needs non-Secure cookies. Use false behind HTTPS in production.
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_ORIGINS: "${APP_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash-lite}"
      GEMINI_TIMEOUT_SECONDS: "${GEMINI_TIMEOUT_SECONDS:-90}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
      DATABASE_PATH: /data/app.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - app-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  app-data:
